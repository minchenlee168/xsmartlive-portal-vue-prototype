<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>抽獎中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; }

    .wrapper {
      position: relative;
      width: 960px;
      height: 425px;
      overflow: hidden;
    }

    .robot {
      position: absolute;
      left: 210px;
      bottom: 0;
      height: 420px;
      width: auto;
      /* 不設 z-index：禮物盒疊在上層，擋住機器人靠過去的手 */
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 手疊在右側舉起處（對齊本體被擦掉的手）；抽獎時以手腕為支點擺動 */
    .robot-hand {
      position: absolute;
      left: 393px;
      top: 232px;
      width: 72px;
      height: auto;
      transform-origin: 20% 88%;
      animation: robotWave 0.5s ease-in-out infinite;
      user-select: none;
      -webkit-user-drag: none;
    }
    @keyframes robotWave {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(12deg); }
    }

    .gift {
      position: absolute;
      left: 424px;
      bottom: 60px;
      width: 232px;
      height: 208px;
      transform-origin: 50% 88%;
      animation: giftShake 0.34s ease-in-out infinite;
    }
    @keyframes giftShake {
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-5px) rotate(-3.5deg); }
      40% { transform: translateX(5px) rotate(3.5deg); }
      60% { transform: translateX(-4px) rotate(-2.5deg); }
      80% { transform: translateX(4px) rotate(2.5deg); }
    }

    .gift__shadow {
      position: absolute;
      left: 50%;
      bottom: -22px;
      transform: translateX(-50%);
      width: 190px;
      height: 30px;
      background: radial-gradient(closest-side, rgba(0, 0, 0, 0.32), transparent 76%);
    }

    .gift__body {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 190px;
      height: 128px;
      border-radius: 10px;
      background: linear-gradient(158deg, #8b5cf6 0%, #6d28d9 46%, #4c1d95 100%);
      box-shadow:
        inset 0 10px 18px rgba(255, 255, 255, 0.18),
        inset 0 -16px 26px rgba(0, 0, 0, 0.32),
        0 8px 20px rgba(76, 29, 149, 0.45),
        0 0 26px rgba(232, 49, 255, 0.4);
      animation: bodyGlow 0.7s ease-in-out infinite;
    }
    @keyframes bodyGlow {
      0%, 100% { box-shadow:
        inset 0 10px 18px rgba(255, 255, 255, 0.18),
        inset 0 -16px 26px rgba(0, 0, 0, 0.32),
        0 8px 20px rgba(76, 29, 149, 0.45),
        0 0 22px rgba(232, 49, 255, 0.35); }
      50% { box-shadow:
        inset 0 10px 18px rgba(255, 255, 255, 0.22),
        inset 0 -16px 26px rgba(0, 0, 0, 0.3),
        0 8px 22px rgba(76, 29, 149, 0.5),
        0 0 40px rgba(232, 49, 255, 0.7); }
    }
    .gift__body::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 34px;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .gift__lid {
      position: absolute;
      left: 50%;
      bottom: 116px;
      transform: translateX(-50%);
      width: 212px;
      height: 40px;
      border-radius: 9px;
      background: linear-gradient(158deg, #a78bfa 0%, #8b5cf6 55%, #6d28d9 100%);
      box-shadow:
        inset 0 8px 14px rgba(255, 255, 255, 0.25),
        inset 0 -8px 14px rgba(0, 0, 0, 0.28),
        0 6px 12px rgba(0, 0, 0, 0.25);
      z-index: 2;
    }
    .gift__lid::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 34px;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .gift__bow {
      position: absolute;
      left: 50%;
      top: -34px;
      width: 110px;
      height: 46px;
      transform: translateX(-50%);
      z-index: 3;
    }
    .gift__bow-tail {
      position: absolute;
      top: 30px;
      width: 16px;
      height: 26px;
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 -2px 5px rgba(0, 0, 0, 0.2);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
    }
    .gift__bow-tail--l { left: 40px; transform: rotate(14deg); transform-origin: top center; }
    .gift__bow-tail--r { right: 40px; transform: rotate(-14deg); transform-origin: top center; }
    .gift__bow-loop {
      position: absolute;
      top: 2px;
      width: 50px;
      height: 40px;
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 3px 5px rgba(255, 255, 255, 0.32), inset 0 -4px 8px rgba(0, 0, 0, 0.22);
    }
    .gift__bow-loop--l { left: 0; border-radius: 80% 30% 60% 40% / 85% 60% 40% 45%; transform: rotate(-10deg); }
    .gift__bow-loop--r { right: 0; border-radius: 30% 80% 40% 60% / 60% 85% 45% 40%; transform: rotate(10deg); }
    .gift__bow-knot {
      position: absolute;
      left: 50%;
      top: 6px;
      width: 26px;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 8px;
      background: linear-gradient(160deg, #f0abfc, #c026d3);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.45), 0 2px 5px rgba(0, 0, 0, 0.28);
      z-index: 2;
    }

    .gift__glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 260px;
      height: 260px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(232, 49, 255, 0.4), transparent 70%);
      z-index: -1;
      animation: glowPulse 0.7s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <img class="robot" src="robot.png" alt="">
    <img class="robot-hand" src="robot-hand.png" alt="">
    <div class="gift">
      <div class="gift__glow"></div>
      <div class="gift__shadow"></div>
      <div class="gift__body"></div>
      <div class="gift__lid">
        <div class="gift__bow">
          <span class="gift__bow-tail gift__bow-tail--l"></span>
          <span class="gift__bow-tail gift__bow-tail--r"></span>
          <span class="gift__bow-loop gift__bow-loop--l"></span>
          <span class="gift__bow-loop gift__bow-loop--r"></span>
          <span class="gift__bow-knot"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
