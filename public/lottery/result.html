<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>開獎</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; }

    .wrapper {
      position: relative;
      width: 960px;
      height: 425px;
      overflow: hidden;
    }

    .robot {
      position: absolute;
      left: 214px;
      bottom: 0;
      height: 420px;
      width: auto;
      /* 不設 z-index：禮物盒疊在上層，擋住機器人靠過去的手 */
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ===== 得主（從盒中升起） ===== */
    #winner-content {
      position: absolute;
      left: 568px;
      top: 138px;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
    }
    #winner-content.show {
      animation: winnerRise 0.6s cubic-bezier(0.2, 0.8, 0.3, 1.3) forwards;
    }
    @keyframes winnerRise {
      0% { opacity: 0; transform: translate(-50%, -50%) translateY(96px) scale(0.32); }
      55% { opacity: 1; }
      100% { opacity: 1; transform: translate(-50%, -50%) translateY(0) scale(1); }
    }
    .winner-ring {
      width: 152px;
      height: 152px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: 0 0 26px rgba(232, 49, 255, 0.6), 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    #winner-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      display: block;
    }
    #winner-content:not(.has-avatar) .winner-ring { display: none; }
    #winner-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    /* ===== 禮物盒 ===== */
    .gift {
      position: absolute;
      left: 452px;
      bottom: 60px;
      width: 232px;
      height: 208px;
      transform-origin: 50% 88%;
    }
    .gift.shaking { animation: giftShake 0.34s ease-in-out infinite; }
    @keyframes giftShake {
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-5px) rotate(-3.5deg); }
      40% { transform: translateX(5px) rotate(3.5deg); }
      60% { transform: translateX(-4px) rotate(-2.5deg); }
      80% { transform: translateX(4px) rotate(2.5deg); }
    }

    .gift__shadow {
      position: absolute;
      left: 50%;
      bottom: -22px;
      transform: translateX(-50%);
      width: 190px;
      height: 30px;
      background: radial-gradient(closest-side, rgba(0, 0, 0, 0.32), transparent 76%);
    }

    .gift__body {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 190px;
      height: 128px;
      border-radius: 10px;
      background: linear-gradient(158deg, #8b5cf6 0%, #6d28d9 46%, #4c1d95 100%);
      box-shadow:
        inset 0 10px 18px rgba(255, 255, 255, 0.18),
        inset 0 -16px 26px rgba(0, 0, 0, 0.32),
        0 8px 20px rgba(76, 29, 149, 0.45);
      transition: box-shadow 0.4s ease;
    }
    .gift.open .gift__body {
      box-shadow:
        inset 0 10px 18px rgba(255, 255, 255, 0.24),
        inset 0 -16px 26px rgba(0, 0, 0, 0.3),
        0 8px 20px rgba(76, 29, 149, 0.5),
        0 0 52px rgba(232, 49, 255, 0.85);
    }
    .gift__body::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 34px;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .gift__lid {
      position: absolute;
      left: 50%;
      bottom: 116px;
      transform: translateX(-50%);
      width: 212px;
      height: 40px;
      border-radius: 9px;
      background: linear-gradient(158deg, #a78bfa 0%, #8b5cf6 55%, #6d28d9 100%);
      box-shadow:
        inset 0 8px 14px rgba(255, 255, 255, 0.25),
        inset 0 -8px 14px rgba(0, 0, 0, 0.28),
        0 6px 12px rgba(0, 0, 0, 0.25);
      z-index: 2;
    }
    .gift.open .gift__lid {
      transition: transform 0.55s cubic-bezier(0.35, 1.3, 0.6, 1), opacity 0.55s ease;
      transform: translateX(-50%) translateY(-210px) rotate(-24deg);
      opacity: 0;
    }
    .gift__lid::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 34px;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .gift__bow {
      position: absolute;
      left: 50%;
      top: -34px;
      width: 110px;
      height: 46px;
      transform: translateX(-50%);
      z-index: 3;
    }
    .gift__bow-tail {
      position: absolute;
      top: 30px;
      width: 16px;
      height: 26px;
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 -2px 5px rgba(0, 0, 0, 0.2);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
    }
    .gift__bow-tail--l { left: 40px; transform: rotate(14deg); transform-origin: top center; }
    .gift__bow-tail--r { right: 40px; transform: rotate(-14deg); transform-origin: top center; }
    .gift__bow-loop {
      position: absolute;
      top: 2px;
      width: 50px;
      height: 40px;
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 3px 5px rgba(255, 255, 255, 0.32), inset 0 -4px 8px rgba(0, 0, 0, 0.22);
    }
    .gift__bow-loop--l { left: 0; border-radius: 80% 30% 60% 40% / 85% 60% 40% 45%; transform: rotate(-10deg); }
    .gift__bow-loop--r { right: 0; border-radius: 30% 80% 40% 60% / 60% 85% 45% 40%; transform: rotate(10deg); }
    .gift__bow-knot {
      position: absolute;
      left: 50%;
      top: 6px;
      width: 26px;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 8px;
      background: linear-gradient(160deg, #f0abfc, #c026d3);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.45), 0 2px 5px rgba(0, 0, 0, 0.28);
      z-index: 2;
    }

    /* ===== 彩帶 ===== */
    #confetti-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
    .confetti {
      position: absolute;
      left: 568px;
      top: 220px;
      width: 11px;
      height: 15px;
      border-radius: 2px;
      opacity: 0;
      will-change: transform, opacity;
    }
    .confetti.go {
      animation: confettiFly 0.95s cubic-bezier(0.2, 0.7, 0.4, 1) forwards;
    }
    @keyframes confettiFly {
      0% { opacity: 1; transform: translate(-50%, -50%) rotate(0); }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot));
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <img class="robot" src="robot.png" alt="">

    <div id="winner-content">
      <div class="winner-ring"><img id="winner-avatar" alt="winner avatar"></div>
      <span id="winner-name"></span>
    </div>

    <div class="gift">
      <div class="gift__shadow"></div>
      <div class="gift__body"></div>
      <div class="gift__lid">
        <div class="gift__bow">
          <span class="gift__bow-tail gift__bow-tail--l"></span>
          <span class="gift__bow-tail gift__bow-tail--r"></span>
          <span class="gift__bow-loop gift__bow-loop--l"></span>
          <span class="gift__bow-loop gift__bow-loop--r"></span>
          <span class="gift__bow-knot"></span>
        </div>
      </div>
    </div>

    <div id="confetti-layer"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name');
    const avatar = params.get('avatar');
    const gift = document.querySelector('.gift');
    const content = document.getElementById('winner-content');
    const avatarEl = document.getElementById('winner-avatar');
    const nameEl = document.getElementById('winner-name');
    const confettiLayer = document.getElementById('confetti-layer');

    const COLORS = ['#22d3ee', '#e831ff', '#a855f7', '#f0abfc', '#ffffff', '#38bdf8'];

    function burstConfetti() {
      const N = 16;
      for (let i = 0; i < N; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        const angle = (Math.PI * (0.15 + 0.7 * (i / (N - 1)))); // 往上散開
        const dist = 120 + Math.random() * 90;
        const dx = Math.cos(angle) * dist * (Math.random() < 0.5 ? -1 : 1);
        const dy = -(70 + Math.random() * 150);
        piece.style.setProperty('--dx', dx.toFixed(0) + 'px');
        piece.style.setProperty('--dy', dy.toFixed(0) + 'px');
        piece.style.setProperty('--rot', (Math.random() * 720 - 360).toFixed(0) + 'deg');
        piece.style.background = COLORS[i % COLORS.length];
        piece.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
        confettiLayer.appendChild(piece);
        requestAnimationFrame(() => piece.classList.add('go'));
      }
    }

    // 起手：短暫搖晃醞釀 → 掀蓋 + 彩帶 → 得主升起 → 通知父頁面
    gift.classList.add('shaking');

    setTimeout(() => {
      gift.classList.remove('shaking');
      gift.classList.add('open');
      burstConfetti();
    }, 650);

    setTimeout(() => {
      if (avatar) { avatarEl.src = avatar; content.classList.add('has-avatar'); }
      if (name) nameEl.textContent = name;
      if (avatar || name) content.classList.add('show'); // 連抽 N>1 無得主參數時僅慶祝
    }, 900);

    setTimeout(() => window.parent?.postMessage('winner-revealed', '*'), 1150);
  </script>
</body>
</html>
