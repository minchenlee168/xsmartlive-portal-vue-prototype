<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>還沒開始抽獎（靜態）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; }

    .wrapper {
      position: relative;
      width: 960px;
      height: 425px;
      overflow: hidden;
    }

    .robot {
      position: absolute;
      left: 214px;
      bottom: 0;
      height: 420px;
      width: auto;
      /* 不設 z-index：禮物盒（DOM 後、疊在上層）會擋住機器人靠過去的手 */
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ===== 禮物盒 ===== */
    .gift {
      position: absolute;
      left: 452px;
      bottom: 60px;
      width: 232px;
      height: 208px;
    }
    .gift--float { animation: giftFloat 3.2s ease-in-out infinite; }
    @keyframes giftFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    .gift__shadow {
      position: absolute;
      left: 50%;
      bottom: -22px;
      transform: translateX(-50%);
      width: 190px;
      height: 30px;
      background: radial-gradient(closest-side, rgba(0, 0, 0, 0.32), transparent 76%);
      animation: shadowPulse 3.2s ease-in-out infinite;
    }
    @keyframes shadowPulse {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.9; }
      50% { transform: translateX(-50%) scale(0.86); opacity: 0.65; }
    }

    /* 盒身 */
    .gift__body {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 190px;
      height: 128px;
      border-radius: 10px;
      background: linear-gradient(158deg, #8b5cf6 0%, #6d28d9 46%, #4c1d95 100%);
      box-shadow:
        inset 0 10px 18px rgba(255, 255, 255, 0.18),
        inset 0 -16px 26px rgba(0, 0, 0, 0.32),
        0 8px 20px rgba(76, 29, 149, 0.45);
    }
    .gift__body::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 34px;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    /* 盒蓋 */
    .gift__lid {
      position: absolute;
      left: 50%;
      bottom: 116px;
      transform: translateX(-50%);
      width: 212px;
      height: 40px;
      border-radius: 9px;
      background: linear-gradient(158deg, #a78bfa 0%, #8b5cf6 55%, #6d28d9 100%);
      box-shadow:
        inset 0 8px 14px rgba(255, 255, 255, 0.25),
        inset 0 -8px 14px rgba(0, 0, 0, 0.28),
        0 6px 12px rgba(0, 0, 0, 0.25);
      z-index: 2;
    }
    .gift__lid::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 34px;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    /* 蝴蝶結 */
    .gift__bow {
      position: absolute;
      left: 50%;
      top: -34px;
      width: 110px;
      height: 46px;
      transform: translateX(-50%);
      z-index: 3;
    }
    /* 緞帶尾巴（垂在蓋子上） */
    .gift__bow-tail {
      position: absolute;
      top: 30px;
      width: 16px;
      height: 26px;
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 -2px 5px rgba(0, 0, 0, 0.2);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
    }
    .gift__bow-tail--l { left: 40px; transform: rotate(14deg); transform-origin: top center; }
    .gift__bow-tail--r { right: 40px; transform: rotate(-14deg); transform-origin: top center; }
    .gift__bow-loop {
      position: absolute;
      top: 2px;
      width: 50px;
      height: 40px;
      background: linear-gradient(135deg, #22d3ee 0%, #a855f7 52%, #e831ff 100%);
      box-shadow: inset 0 3px 5px rgba(255, 255, 255, 0.32), inset 0 -4px 8px rgba(0, 0, 0, 0.22);
    }
    .gift__bow-loop--l { left: 0; border-radius: 80% 30% 60% 40% / 85% 60% 40% 45%; transform: rotate(-10deg); }
    .gift__bow-loop--r { right: 0; border-radius: 30% 80% 40% 60% / 60% 85% 45% 40%; transform: rotate(10deg); }
    .gift__bow-knot {
      position: absolute;
      left: 50%;
      top: 6px;
      width: 26px;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 8px;
      background: linear-gradient(160deg, #f0abfc, #c026d3);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.45), 0 2px 5px rgba(0, 0, 0, 0.28);
      z-index: 2;
    }

    /* 待機微光 */
    .gift__glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 240px;
      height: 240px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(168, 85, 247, 0.35), transparent 70%);
      z-index: -1;
      animation: glowPulse 3.2s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <img class="robot" src="robot.png" alt="">
    <div class="gift gift--float">
      <div class="gift__glow"></div>
      <div class="gift__shadow"></div>
      <div class="gift__body"></div>
      <div class="gift__lid">
        <div class="gift__bow">
          <span class="gift__bow-tail gift__bow-tail--l"></span>
          <span class="gift__bow-tail gift__bow-tail--r"></span>
          <span class="gift__bow-loop gift__bow-loop--l"></span>
          <span class="gift__bow-loop gift__bow-loop--r"></span>
          <span class="gift__bow-knot"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
