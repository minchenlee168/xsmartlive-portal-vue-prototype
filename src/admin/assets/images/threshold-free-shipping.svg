    </g>
    <ellipse cx="31" cy="108" rx="7.5" ry="2.4" fill="#00C8FF" stroke="none"/>
    <!-- money: banknote -->
    <g transform="rotate(-8 74 128)">
      <rect x="57" y="119" width="40" height="21" rx="2.5" fill="#00C8FF" stroke="none" transform="translate(3 2)"/>
      <rect x="54" y="117" width="40" height="21" rx="2.5" fill="#fff"/>
      <circle cx="74" cy="127.5" r="5"/>
      <path d="M59 122 V124 M89 131 V133"/>
