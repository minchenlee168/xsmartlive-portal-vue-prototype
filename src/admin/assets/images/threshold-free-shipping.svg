    <circle cx="76" cy="100" r="9" fill="#363636"/>
    <circle cx="76" cy="100" r="2.8" fill="#fff" stroke="none"/>
    <circle cx="137" cy="100" r="9" fill="#363636"/>
    <circle cx="137" cy="100" r="2.8" fill="#fff" stroke="none"/>

    <!-- discount tag on truck -->
    <g transform="rotate(-12 90 70)">
      <path d="M80 56 H104 a3 3 0 0 1 3 3 V81 a3 3 0 0 1 -3 3 H80 L72 70 Z" fill="#F032FF" stroke="none" transform="translate(3 2)"/>
      <path d="M80 56 H104 a3 3 0 0 1 3 3 V81 a3 3 0 0 1 -3 3 H80 L72 70 Z"/>
      <circle cx="80" cy="70" r="2.2" fill="#fff"/>
      <!-- % -->
      <circle cx="89" cy="63" r="3.2" fill="#fff"/>
      <circle cx="100" cy="77" r="3.2" fill="#fff"/>
      <path d="M100 61 L89 79" stroke-width="2.5"/>
    </g>

    <!-- money: coins -->
    <g fill="#fff">
      <path d="M14 126 V132 a17 5.5 0 0 0 34 0 V126"/>
      <ellipse cx="31" cy="126" rx="17" ry="5.5"/>
      <path d="M16 117 V123 a17 5.5 0 0 0 34 0 V117"/>
      <ellipse cx="33" cy="117" rx="17" ry="5.5"/>
      <path d="M14 108 V114 a17 5.5 0 0 0 34 0 V108"/>
