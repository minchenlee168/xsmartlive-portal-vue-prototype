<svg xmlns="http://www.w3.org/2000/svg" width="170" height="160" viewBox="0 0 170 160" fill="none">
  <g stroke="#363636" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- sparkles -->
    <path d="M26 22 C27 28 29 30 35 31 C29 32 27 34 26 40 C25 34 23 32 17 31 C23 30 25 28 26 22 Z" fill="#fff"/>
    <path d="M44 46 C44.5 49 45.5 50 48.5 50.5 C45.5 51 44.5 52 44 55 C43.5 52 42.5 51 39.5 50.5 C42.5 50 43.5 49 44 46 Z" fill="#fff"/>

    <!-- truck -->
    <rect x="60" y="48" width="70" height="52" rx="4" fill="#363636"/>
    <rect x="55" y="44" width="70" height="52" rx="4" fill="#fff"/>
    <path d="M125 62 H141 a4 4 0 0 1 3.4 1.9 L153 80 V96 H125 Z" fill="#fff"/>
    <path d="M131 67 H140 L146 79 H131 Z" fill="#00C8FF" stroke="none"/>
